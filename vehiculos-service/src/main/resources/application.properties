server.port=8082
spring.application.name=vehiculos-service

# Configuración H2 Database
spring.datasource.url=jdbc:h2:mem:vehiculosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
jwt.secret=${JWT_SECRET:change-this-only-for-local-tests-change-this-key}
usuarios.service.uri=${USUARIOS_SERVICE_URI:http://127.0.0.1:8081}
viajes.service.uri=${VIAJES_SERVICE_URI:http://127.0.0.1:8083}
internal.api.secret=${INTERNAL_API_SECRET:change-this-only-for-local-tests-internal-key}