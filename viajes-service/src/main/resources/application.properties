server.port=8083
spring.application.name=viajes-service

# Configuración H2 Database
spring.datasource.url=jdbc:h2:mem:viajesdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
jwt.secret=${JWT_SECRET:change-this-only-for-local-tests-change-this-key}
usuarios.service.uri=${USUARIOS_SERVICE_URI:http://127.0.0.1:8081}
vehiculos.service.uri=${VEHICULOS_SERVICE_URI:http://127.0.0.1:8082}
internal.api.secret=${INTERNAL_API_SECRET:change-this-only-for-local-tests-internal-key}