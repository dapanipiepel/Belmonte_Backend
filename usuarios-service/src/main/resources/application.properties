spring.application.name=usuarios-service
spring.flyway.enabled=false
server.port=8081
jwt.secret=${JWT_SECRET:change-this-only-for-local-tests-change-this-key}
jwt.expiration=43200000
internal.api.secret=${INTERNAL_API_SECRET:change-this-only-for-local-tests-internal-key}
viajes.service.uri=${VIAJES_SERVICE_URI:http://127.0.0.1:8083}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
belmonte.mail.from=${SMTP_FROM:no-reply@localhost}
belmonte.enlaces.activacion=${ACTIVACION_URL:http://localhost:3000/activar}
belmonte.enlaces.recuperacion=${RECUPERACION_URL:http://localhost:3000/recuperar}
